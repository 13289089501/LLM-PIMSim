# 04_ic_reference_hardware.yaml — IC 参考实验硬件（GPU + DRAM-PIM + SRAM-PIM + ReRAM-PIM）
# 以集成电路视角设定四类异构计算/存储设备，作为"参考部署"的硬件底座。
devices:
  - id: gpu0
    type: GPU
    compute:
      peak_tflops: 312
    efficiency:
      GEMM: 0.85
      Attention: 0.60
      Softmax: 0.30
      LayerNorm: 0.25
    memory:
      capacity_gb: 80
      read_bandwidth_gbs: 2039
      write_bandwidth_gbs: 2039
      read_latency_ns: 400
      write_latency_ns: 400

  - id: pim0
    type: DRAM_PIM
    compute:
      peak_tflops: 1.2
    efficiency:
      GEMM: 0.70
      Attention: 0.40
      Softmax: 0.20
      LayerNorm: 0.15
    memory:
      capacity_gb: 8
      read_bandwidth_gbs: 307.2
      write_bandwidth_gbs: 307.2
      read_latency_ns: 50
      write_latency_ns: 50

  - id: sram0
    type: SRAM_PIM
    compute:
      peak_tflops: 500
    efficiency:
      GEMM: 0.80
      Attention: 0.50
      Softmax: 0.30
      LayerNorm: 0.25
    memory:
      capacity_mb: 512
      read_bandwidth_gbs: 1500000
      write_bandwidth_gbs: 1500000
      read_latency_ns: 2
      write_latency_ns: 2

  - id: rram0
    type: RERAM_PIM
    compute:
      peak_tflops: 20
    efficiency:
      GEMM: 0.60
      Attention: 0.30
      Softmax: 0.10
      LayerNorm: 0.10
    memory:
      capacity_mb: 64
      read_bandwidth_gbs: 128
      write_bandwidth_gbs: 32
      read_latency_ns: 10
      write_latency_ns: 100
