# hardware.yaml — 硬件清单（配置驱动）
# 想加硬件: 在 devices 加一段；想删: 删一段；改参数: 覆盖字段即可。
# type 决定"出厂预设"，下面字段覆盖预设；不写就用出厂值。
# ============ 数据来源（硬件校准） ============
#   CPU       : Intel Xeon Platinum 8480+ (Sapphire Rapids), DDR5-4800, BF16 AMX
#   GPU       : NVIDIA A100 80GB SXM, BF16/FP16 Tensor Core dense(不含 sparsity)
#   SRAM-PIM  : 7nm SRAM-CIM, ISSCC 类代表值
#   DRAM-PIM  : Samsung HBM2-PIM Aquabolt-XL (单 stack)
#   ReRAM-PIM : NeuRRAM/RRAM-CIM, Nature 2023 类代表值（读写不对称）
# 单位: peak_tflops 自动 ×1e12 → FLOPS；带宽 GB/s 自动 ×1e9 → Bps；容量 GB/MB 自动转 Byte；延迟 ns。

devices:
  - id: cpu0
    type: CPU
    compute:
      peak_tflops: 45.9          # BF16 AMX 峰值
      parallelism: 1
    memory:
      capacity_mb: 4             # v3.1：CPU 为纯执行单元，仅保留极小运行缓存（与出厂预设一致）
      read_bandwidth_gbs: 307.2
      write_bandwidth_gbs: 307.2
      read_latency_ns: 90
      write_latency_ns: 90

  - id: gpu0
    type: GPU
    compute:
      peak_tflops: 312           # A100 dense BF16/FP16 Tensor Core 主峰值
      parallelism: 100
    efficiency:                 # 同一硬件对不同算子效率不同
      GEMM: 0.85
      Attention: 0.60
      Softmax: 0.30
      LayerNorm: 0.25
    memory:
      capacity_gb: 80
      read_bandwidth_gbs: 2039
      write_bandwidth_gbs: 2039
      read_latency_ns: 400
      write_latency_ns: 400

  - id: pim0
    type: DRAM_PIM
    compute:
      peak_tflops: 1.2           # FP16（单 stack 代表值）
      parallelism: 16
    efficiency:
      GEMM: 0.70
      Attention: 0.40
      Softmax: 0.20
      LayerNorm: 0.15
    memory:
      capacity_gb: 8
      read_bandwidth_gbs: 307.2
      write_bandwidth_gbs: 307.2
      read_latency_ns: 50
      write_latency_ns: 50

  - id: sram0
    type: SRAM_PIM
    compute:
      peak_tflops: 500           # FP16/BF16
      parallelism: 32
    efficiency:
      GEMM: 0.80
      Attention: 0.50
      Softmax: 0.30
      LayerNorm: 0.25
    memory:
      capacity_mb: 512
      read_bandwidth_gbs: 1500000   # 1.5 PB/s
      write_bandwidth_gbs: 1500000
      read_latency_ns: 2
      write_latency_ns: 2

  - id: rram0
    type: RERAM_PIM
    compute:
      peak_tflops: 20            # INT8
      parallelism: 64
    efficiency:
      GEMM: 0.60
      Attention: 0.30
      Softmax: 0.10
      LayerNorm: 0.10
    memory:
      capacity_mb: 256           # 与参考实验 04_ic_reference 口径一致（256MB）
      read_bandwidth_gbs: 128
      write_bandwidth_gbs: 32
      read_latency_ns: 10
      write_latency_ns: 100

# ============================================================
# 精度与峰值算力
# 精度系统（合同 precisions.py / contracts.PrecisionLevel）固定 6 种：
#   INT4 < INT8 < FP8 < FP16 < BF16 < FP32（按精度等级排序）
# 峰值算力：
#   新格式 compute.peak_throughput: {FP16:{value,unit}, INT8:{value,unit}, ...}
#   可为不同精度配不同算力；key 即该硬件“真正配置支持”的精度（单一事实来源）。
#   旧格式 compute.peak_tflops / peak_tops 单值：会自动填到默认全部精度
#   （本文件当前用单值主峰值，主推理精度对应值）。
# 支持的精度：
#   - 运行时“能否执行某算子”由 precisions.py 的固定三维 Capability 判定（can_execute）。
#   - 本文件的 supported_precision / peak_throughput 仅作配置层声明，不影响 can_execute。
# 注意：任务给出的部分“支持精度”（如 GPU 的 FP64/TF32）不在 6 种精度枚举内，
#   因此不会出现在配置层；如需表达，请以 precisions.py 的固定 Capability 为准。
# 算子精度由模型决定（默认 FP16）。
# ============================================================
