# 04_ic_reference.yaml — 领域专家参考样例实验（GPU + 3×PIM + 大容量 DRAM）
# 用途：给用户一个"开箱即跑"的参考部署，覆盖主流异构放置（GPU/DRAM-PIM/SRAM-PIM/ReRAM-PIM）。
# 用户可以在此基础上改少数算子/权重位置做对比，而不必从零搭整个配置。
# 放置原则（集成电路视角、按领域常识，而非"最短延时"优化）：见各子配置顶部注释。
# 设计说明详见：configs/experiments/04_ic_reference_*.yaml 顶部注释。
experiment:
  name: 04_ic_reference
  model: llama_gb
  seed: 42
  files:
    hardware: 04_ic_reference_hardware.yaml
    interconnect: 04_ic_reference_interconnect.yaml
    mapping: 04_ic_reference_mapping.yaml
    placement: 04_ic_reference_placement.yaml
  output:
    dir: results/
  workload:
    input_tokens: 2048
    generate_tokens: 128
