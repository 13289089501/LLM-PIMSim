# hardware.yaml — 硬件清单（配置驱动）
# 想加硬件: 在 devices 加一段；想删: 删一段；改参数: 覆盖字段即可。
# type 决定"出厂预设"，下面字段覆盖预设；不写就用出厂值。

devices:
  - id: gpu0
    type: GPU
    # supported_precision: [FP32, FP16, INT8, INT4]   # 可选：限制该硬件能算哪些精度
    compute:
      peak_tflops: 300          # GPU 算力（人话单位，自动换算）
      parallelism: 100
    efficiency:                 # 同一硬件对不同算子效率不同
      GEMM: 0.85
      Attention: 0.60
      Softmax: 0.30
      LayerNorm: 0.25
    memory:
      capacity_gb: 80
      read_bandwidth_gbs: 2000
      write_bandwidth_gbs: 1800
      read_latency_ns: 100
      write_latency_ns: 100

  - id: pim0
    type: DRAM_PIM
    # 默认支持全部四种精度。要做"低精度PIM研究"可这样限制：
    # supported_precision: [INT8, INT4]
    compute:
      peak_tops: 50             # PIM 用 TOPS 写
    efficiency:
      GEMM: 0.70
      Attention: 0.40
      Softmax: 0.20
      LayerNorm: 0.15
    memory:
      capacity_gb: 512
      read_bandwidth_gbs: 800
      write_bandwidth_gbs: 600
      read_latency_ns: 50
      write_latency_ns: 80

  - id: sram0
    type: SRAM_PIM
    # 高带宽近存计算：归一化/Softmax/激活等归约+逐元素算子的首选（FP32 累加精度稳）
    compute:
      peak_tops: 200
    efficiency:
      GEMM: 0.40
      Attention: 0.35
      Softmax: 0.60
      LayerNorm: 0.55
      Activation: 0.60
      Residual: 0.60
    memory:
      capacity_mb: 128
      read_bandwidth_gbs: 4000
      write_bandwidth_gbs: 3000
      read_latency_ns: 20
      write_latency_ns: 20

# ============================================================
# 精度模型说明（v2.1 新增）
# 四种精度模式，数值=等级（越大精度越高）：
#   FP32 = 4 (最高)   FP16 = 3 (BF16同档)   INT8 = 2   INT4 = 1 (最低)
# 兼容规则: 硬件支持的最高精度等级 >= 算子要求的精度等级，才允许计算。
#   例如: 若某 PIM 只支持 [INT8, INT4]，则 FP16 算子不能映射到它（精度不匹配）。
# 硬件默认支持全部四种；用 supported_precision 字段可缩小。
# 算子精度由模型决定（默认 FP16），后续可在 mapping/模型层调整。
# HIGH/LOW 语义仍可用: HIGH≈FP16及以上, LOW≈INT8及以下。
# ============================================================
