# placement_pim.yaml — GPU+PIM 实验专用
# FFN 权重驻留 PIM（配合 FFN 在 PIM 算 → 权重驻留命中）
# 其余权重 / 激活 / KV Cache 驻留 GPU
# 兼容 kernel 粒度命名(*ffn_gw/*ffn_uw 等) 与 旧命名(*ffn1_weight/*ffn2_weight)
default_device: gpu0

initial:
  # FFN 权重 驻留 PIM（两种命名都覆盖）
  - data_id: "*ffn_gw"
    devices: [pim0]
  - data_id: "*ffn_uw"
    devices: [pim0]
  - data_id: "*ffn1_weight"
    devices: [pim0]
  - data_id: "*ffn2_weight"
    devices: [pim0]

  # 其余权重 驻留 GPU
  - data_type: WEIGHT
    devices: [gpu0]

  # KV Cache / 激活 / 中间数据 驻留 GPU
  - data_type: KV_CACHE
    devices: [gpu0]
  - data_type: ACTIVATION
    devices: [gpu0]
  - data_type: TEMPORARY
    devices: [gpu0]
