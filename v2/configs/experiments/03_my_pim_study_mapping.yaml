# mapping_gpu.yaml — GPU-only 方案：所有算子放 GPU，所有数据从 GPU 取
default:
  compute_device: gpu0
  data_source: auto

rules:
  - op_type: GEMM
    device: gpu0
  - op_type: LayerNorm
    device: gpu0
  - op_type: Attention
    device: gpu0
  - op_type: Softmax
    device: gpu0
  - op_type: Residual
    device: gpu0
