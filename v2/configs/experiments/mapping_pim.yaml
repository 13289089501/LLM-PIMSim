# mapping_pim.yaml — GPU+PIM 方案：FFN 放 PIM，其余放 GPU
# 同时兼容两套算子命名：
#   - kernel 粒度 (workload 路径): L*_ffn_gate / L*_ffn_up / L*_ffn_down
#   - 旧的 model_lib 命名:        L*_ffn1 / L*_ffn2
default:
  compute_device: gpu0
  data_source: auto

rules:
  # ---- kernel 粒度 (workload 驱动)：FFN 三个 GEMM 放 PIM ----
  - op: "L*_ffn_gate"
    device: pim0
  - op: "L*_ffn_up"
    device: pim0
  - op: "L*_ffn_down"
    device: pim0

  # ---- 旧的 model_lib 命名：FFN 放 PIM ----
  - op: "L*_ffn1"
    device: pim0
  - op: "L*_ffn2"
    device: pim0

  # 其余算子放 GPU（GEMM / LayerNorm / Softmax / Residual / Activation / Ex）
  - op_type: GEMM
    device: gpu0
  - op_type: LayerNorm
    device: gpu0
  - op_type: Softmax
    device: gpu0
  - op_type: Residual
    device: gpu0
  - op_type: Activation
    device: gpu0
  - op_type: LMHead
    device: gpu0
  - op_type: Embedding
    device: gpu0
  - op_type: KVCacheUpdate
    device: gpu0
